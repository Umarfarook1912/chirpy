name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck — shared
        run: pnpm --filter @chirpy/shared typecheck

      - name: Typecheck — backend
        run: pnpm --filter @chirpy/backend typecheck

      - name: Typecheck — web
        run: pnpm --filter @chirpy/web typecheck

      - name: Typecheck — extension
        run: pnpm --filter @chirpy/extension typecheck

      - name: Test — backend
        run: pnpm --filter @chirpy/backend test

      - name: Test — web
        run: pnpm --filter @chirpy/web test

      - name: Test — extension
        run: pnpm --filter @chirpy/extension test

      - name: Build — web
        run: pnpm --filter @chirpy/web build

      - name: Build — shared
        run: pnpm --filter @chirpy/shared build
        continue-on-error: true
